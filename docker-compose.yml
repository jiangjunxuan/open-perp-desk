services:
  web:
    build:
      context: ./apps/web
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  api:
    init: true
    build:
      context: ./services/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      TRADING_MODE: ${TRADING_MODE:-demo}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-BTC-USDT-SWAP,ETH-USDT-SWAP}
      OKX_REST_BASE_URL: ${OKX_REST_BASE_URL:-https://www.okx.com}
      OKX_WS_PUBLIC_URL: ${OKX_WS_PUBLIC_URL:-wss://ws.okx.com:8443/ws/v5/public}
      OKX_WS_CANDLES_URL: ${OKX_WS_CANDLES_URL:-wss://ws.okx.com:8443/ws/v5/business}
      OKX_WS_PRIVATE_URL: ${OKX_WS_PRIVATE_URL:-}
      OKX_WS_BUSINESS_URL: ${OKX_WS_BUSINESS_URL:-}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      OKX_DEMO: ${OKX_DEMO:-true}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      LIVE_UNLOCK_PHRASE: ${LIVE_UNLOCK_PHRASE:-}
      AUTO_TRADING_ENABLED: ${AUTO_TRADING_ENABLED:-false}
      AUTO_TRADING_DRY_RUN: ${AUTO_TRADING_DRY_RUN:-true}
      AUTO_TRADING_SYMBOLS: ${AUTO_TRADING_SYMBOLS:-BTC-USDT-SWAP}
      AUTO_TRADING_BAR: ${AUTO_TRADING_BAR:-15m}
      AUTO_TRADING_INTERVAL_SECONDS: ${AUTO_TRADING_INTERVAL_SECONDS:-60}
      AUTO_TRADING_CANDLE_LIMIT: ${AUTO_TRADING_CANDLE_LIMIT:-100}
      AUTO_TRADING_STRATEGY_ID: ${AUTO_TRADING_STRATEGY_ID:-structured-technical}
      AUTO_TRADING_ACCOUNT_EQUITY: ${AUTO_TRADING_ACCOUNT_EQUITY:-1000}
      ACCOUNT_SYNC_INTERVAL_SECONDS: ${ACCOUNT_SYNC_INTERVAL_SECONDS:-30}
      OKX_PROXY_URL: ${OKX_PROXY_URL:-}
      DATA_DIR: ${DATA_DIR:-/data}
      STATE_DB_PATH: ${STATE_DB_PATH:-}
      PUSHPLUS_BASE_URL: ${PUSHPLUS_BASE_URL:-https://www.pushplus.plus/send}
      PUSHPLUS_TOKEN: ${PUSHPLUS_TOKEN:-}
      PUSHPLUS_PROXY_URL: ${PUSHPLUS_PROXY_URL:-}
      TRADINGAGENTS_ENABLED: ${TRADINGAGENTS_ENABLED:-false}
      TRADINGAGENTS_PATH: ${TRADINGAGENTS_PATH:-/opt/tradingagents}
      TRADINGAGENTS_PYTHON: ${TRADINGAGENTS_PYTHON:-}
      TRADINGAGENTS_TIMEOUT_SECONDS: ${TRADINGAGENTS_TIMEOUT_SECONDS:-300}
      TRADINGAGENTS_MAX_OUTPUT_BYTES: ${TRADINGAGENTS_MAX_OUTPUT_BYTES:-4194304}
      TRADINGAGENTS_MAX_TOKENS: ${TRADINGAGENTS_MAX_TOKENS:-4096}
      TRADINGAGENTS_LLM_MAX_RETRIES: ${TRADINGAGENTS_LLM_MAX_RETRIES:-1}
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: ${TRADINGAGENTS_MAX_DEBATE_ROUNDS:-1}
      TRADINGAGENTS_MAX_RISK_ROUNDS: ${TRADINGAGENTS_MAX_RISK_ROUNDS:-1}
      TRADINGAGENTS_MAX_RECUR_LIMIT: ${TRADINGAGENTS_MAX_RECUR_LIMIT:-80}
      TRADINGAGENTS_OUTPUT_LANGUAGE: ${TRADINGAGENTS_OUTPUT_LANGUAGE:-Chinese}
      TRADINGAGENTS_LLM_PROVIDER: ${TRADINGAGENTS_LLM_PROVIDER:-openai}
      TRADINGAGENTS_DEEP_THINK_LLM: ${TRADINGAGENTS_DEEP_THINK_LLM:-}
      TRADINGAGENTS_QUICK_THINK_LLM: ${TRADINGAGENTS_QUICK_THINK_LLM:-}
      TRADINGAGENTS_LLM_BACKEND_URL: ${TRADINGAGENTS_LLM_BACKEND_URL:-}
      TRADINGAGENTS_CACHE_DIR: ${TRADINGAGENTS_CACHE_DIR:-/data/tradingagents/cache}
      TRADINGAGENTS_RESULTS_DIR: ${TRADINGAGENTS_RESULTS_DIR:-/data/tradingagents/results}
      TRADINGAGENTS_MEMORY_LOG_PATH: ${TRADINGAGENTS_MEMORY_LOG_PATH:-/data/tradingagents/memory/trading_memory.md}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      RISK_MAX_LEVERAGE: ${RISK_MAX_LEVERAGE:-3}
      RISK_MAX_POSITION_PCT: ${RISK_MAX_POSITION_PCT:-10}
      RISK_MAX_TOTAL_NOTIONAL_PCT: ${RISK_MAX_TOTAL_NOTIONAL_PCT:-30}
      RISK_MIN_CONFIDENCE: ${RISK_MIN_CONFIDENCE:-0.65}
      RISK_MAX_DAILY_LOSS_PCT: ${RISK_MAX_DAILY_LOSS_PCT:-3}
      RISK_MAX_STOP_DISTANCE_PCT: ${RISK_MAX_STOP_DISTANCE_PCT:-5}
    expose:
      - "8000"
    volumes:
      - openperpdesk-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  openperpdesk-data:
