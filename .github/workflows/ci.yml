name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements.txt
      - run: python -m compileall -q services/api/app
      - run: PYTHONPATH=services/api python -m unittest discover -s services/api/tests -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - name: compose runtime smoke
        run: |
          set -eu
          trap 'docker compose logs --no-color; docker compose down -v' EXIT
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent http://127.0.0.1:8080/api/v1/system/status >/dev/null

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check apps/web/app.js
      - run: |
          node <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("apps/web/index.html", "utf8");
          for (const marker of ["price-chart", "status-ribbon", "ribbon-worker", "admin-token"]) {
            if (!html.includes(marker)) throw new Error(`missing web marker: ${marker}`);
          }
          console.log("web smoke markers passed");
          NODE
